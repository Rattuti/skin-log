<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>skin-log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#E4E8E4;
  --surface:#F7F9F6;
  --surface-2:#EDF0EC;
  --ink:#161D1A;
  --ink-2:#3E4A45;
  --muted:#5D6661;
  --line:#CFD6D0;
  --accent:#26695A;
  --accent-soft:#DCE8E3;
  --warn:#9E4436;
  --warn-soft:#F0DDD8;
  --drug:#4A5C8C;

  --s1:#B4655A;
  --s2:#BE8A70;
  --s3:#B0B5A9;
  --s4:#6E9B85;
  --s5:#26695A;

  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,"Roboto Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper)}
body{
  font-family:var(--jp);color:var(--ink);
  font-size:15px;line-height:1.7;
  padding-bottom:84px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:480px;margin:0 auto;padding:0 18px}

/* ---- 署名要素: 日々のストライプ帯 ---- */
.band{
  background:var(--ink);
  padding:18px 0 14px;
  position:sticky;top:0;z-index:20;
}
.band .wrap{display:block}
.band-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:10px;
}
.band-title{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  color:#8FA69C;text-transform:uppercase;
}
.band-count{font-family:var(--mono);font-size:10px;color:#8FA69C;letter-spacing:.08em}
.stripes{
  display:flex;gap:2px;align-items:flex-end;height:46px;
  overflow:hidden;
}
.stripe{
  flex:1 1 0;min-width:0;border-radius:1px;
  background:#2A3532;height:100%;position:relative;
  transition:opacity .2s;
}
.stripe.today{outline:1.5px solid #F7F9F6;outline-offset:1px}
.stripe .drug-dot{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:-7px;width:3px;height:3px;border-radius:50%;background:var(--drug);
}
.stripe.flare::after{
  content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:3px;height:3px;border-radius:50%;background:var(--warn);
}
.band-legend{
  display:flex;justify-content:space-between;margin-top:14px;
  font-family:var(--mono);font-size:9px;color:#7E8D87;letter-spacing:.06em;
}

/* ---- 共通 ---- */
h2{font-size:13px;font-weight:700;letter-spacing:.04em;margin:26px 0 10px}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:var(--muted);text-transform:uppercase;margin:28px 0 8px;
  display:flex;align-items:center;gap:8px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:3px;padding:16px;margin-bottom:12px;
}
.muted{color:var(--muted);font-size:12.5px;line-height:1.65}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{
  border:1px solid var(--line);background:var(--surface);
  padding:9px 14px;border-radius:3px;font-size:13px;
}
.btn:active{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-ghost{border-color:transparent;color:var(--muted);font-size:12.5px;padding:6px 8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- 今日 ---- */
.today-head{margin:22px 0 4px}
.today-date{font-size:26px;font-weight:700;letter-spacing:.01em}
.today-sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em}

.routines{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.rt{
  border:1px solid var(--line);background:var(--surface);
  border-radius:3px;padding:16px 12px;text-align:center;
  display:flex;flex-direction:column;gap:5px;align-items:center;
  transition:background .15s,border-color .15s;
}
.rt-mark{font-size:19px;line-height:1}
.rt-name{font-size:14px;font-weight:500}
.rt-items{font-size:10.5px;color:var(--muted);line-height:1.4}
.rt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rt.on .rt-items{color:#C6DED6}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.sc{
  aspect-ratio:1;border-radius:3px;border:1px solid var(--line);
  background:var(--surface);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  transition:transform .12s;
}
.sc:active{transform:scale(.94)}
.sc .dot{width:13px;height:13px;border-radius:50%}
.sc .lb{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.sc.on{border-width:2px;border-color:var(--ink)}
.sc.on .lb{color:var(--ink)}
.scale-ends{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--muted)}

.pro-card{
  border:1px solid var(--drug);background:#EBEEF6;
  border-radius:3px;padding:14px 16px;margin-top:12px;
  display:flex;align-items:center;gap:13px;
}
.pro-card.done{background:var(--surface-2);border-color:var(--line)}
.pro-body{flex:1;min-width:0}
.pro-title{font-size:13.5px;font-weight:500}
.pro-sub{font-size:11px;color:var(--muted)}

.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tag{
  border:1px solid var(--line);background:var(--surface);
  border-radius:100px;padding:6px 13px;font-size:12.5px;
}
.tag.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

details.extra{margin-top:14px}
details.extra summary{
  list-style:none;font-size:12.5px;color:var(--muted);
  padding:8px 0;display:flex;align-items:center;gap:6px;
}
details.extra summary::-webkit-details-marker{display:none}
details.extra summary::before{content:"＋";font-family:var(--mono);font-size:11px}
details.extra[open] summary::before{content:"−"}

/* ---- 検証 ---- */
.metric{display:flex;align-items:baseline;gap:9px}
.metric-v{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em}
.metric-u{font-size:12px;color:var(--muted)}
.delta{font-family:var(--mono);font-size:13px;padding:1px 7px;border-radius:2px}
.delta.up{background:var(--accent-soft);color:var(--accent)}
.delta.down{background:var(--warn-soft);color:var(--warn)}
.delta.flat{background:var(--surface-2);color:var(--muted)}

.bar-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:none}
.bar-name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{width:74px;height:6px;background:var(--surface-2);border-radius:100px;position:relative;flex:none}
.bar-fill{position:absolute;top:0;height:100%;border-radius:100px}
.bar-n{font-family:var(--mono);font-size:10px;color:var(--muted);width:44px;text-align:right;flex:none}

.heat{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px}
.heat-col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.hc{aspect-ratio:1;border-radius:2px;background:var(--surface-2)}
.hc.sched{background:#D3DAE9}
.hc.done{background:var(--drug)}
.hc.miss{background:var(--warn-soft);border:1px solid var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

.flare-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.flare-item:last-child{border-bottom:none}
.concern-item{padding:12px 0;border-bottom:1px solid var(--line)}
.concern-item:last-child{border-bottom:none}
.concern-head{display:flex;align-items:center;gap:8px}
.flare-d{font-family:var(--mono);font-size:11.5px;color:var(--warn);width:52px;flex:none}

/* ---- 棚 ---- */
.item{
  display:flex;align-items:center;gap:11px;padding:12px 0;
  border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:none}
.item-b{flex:1;min-width:0}
.item-n{font-size:14px;font-weight:500}
.item-m{font-size:11px;color:var(--muted)}
.pill{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  padding:2px 7px;border-radius:2px;background:var(--surface-2);color:var(--muted);
}
.pill.trial{background:var(--accent-soft);color:var(--accent)}
.pill.drug{background:#E3E8F3;color:var(--drug)}

.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=date],select,textarea{
  width:100%;font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);
  border-radius:3px;padding:10px 11px;
}
textarea{resize:vertical;min-height:66px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:5px 11px;font-size:12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}

.sheet-bg{
  position:fixed;inset:0;background:rgba(22,29,26,.4);z-index:40;
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--paper);width:100%;max-width:480px;
  border-radius:10px 10px 0 0;padding:20px 18px 30px;
  max-height:88vh;overflow:auto;
}
.sheet h3{font-size:16px;margin-bottom:16px}
.sheet-act{display:flex;gap:9px;margin-top:18px}
.sheet-act .btn{flex:1;text-align:center;padding:12px}

/* ---- 参考 ---- */
.ref dt{font-size:13.5px;font-weight:500;margin-top:14px}
.ref dd{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-top:3px}
.conflict{border-left:3px solid var(--warn);padding:10px 0 10px 12px;margin-bottom:11px}
.conflict.info{border-left-color:var(--muted)}
.conflict-h{font-size:13px;font-weight:500}
.notice{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:3px;padding:13px 14px;font-size:11.5px;
  color:var(--ink-2);line-height:1.75;margin-top:16px;
}
.rank{display:flex;gap:2px;margin-top:8px}
.rank div{
  flex:1;text-align:center;font-family:var(--mono);font-size:9px;
  padding:7px 2px;color:#fff;line-height:1.4;
}

/* ---- タブ ---- */
.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;padding:11px 0 13px;text-align:center;
  display:flex;flex-direction:column;gap:3px;align-items:center;
  color:var(--muted);
}
.tab-l{font-size:10.5px;letter-spacing:.04em}
.tab-i{width:15px;height:15px;border:1.5px solid currentColor;border-radius:2px}
.tab[data-t=today] .tab-i{border-radius:50%}
.tab[data-t=verify] .tab-i{border-radius:0;border-width:0 0 1.5px 1.5px}
.tab[data-t=ref] .tab-i{border-radius:2px 2px 8px 2px}
.tab.on{color:var(--accent)}
.tab.on .tab-i{background:var(--accent-soft)}

.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:13px;line-height:1.8}
.toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--surface);padding:9px 17px;
  border-radius:3px;font-size:12.5px;z-index:50;
  animation:up .25s ease;
}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media print{
  .tabs,.band,.no-print{display:none!important}
  body{background:#fff;padding:0}
  .card{break-inside:avoid;border-color:#999}
}
</style>

<div class="band">
  <div class="wrap">
    <div class="band-head">
      <span class="band-title">skin&nbsp;log</span>
      <span class="band-count num" id="bandCount"></span>
    </div>
    <div class="stripes" id="stripes"></div>
    <div class="band-legend"><span id="bandFrom"></span><span>今日</span></div>
  </div>
</div>

<main class="wrap" id="view"></main>

<nav class="tabs">
  <button class="tab on" data-t="today"><span class="tab-i"></span><span class="tab-l">今日</span></button>
  <button class="tab" data-t="verify"><span class="tab-i"></span><span class="tab-l">検証</span></button>
  <button class="tab" data-t="shelf"><span class="tab-i"></span><span class="tab-l">棚</span></button>
  <button class="tab" data-t="ref"><span class="tab-i"></span><span class="tab-l">参考</span></button>
</nav>

<script>
/* ============================================================
   Store — 保存層アダプタ
   本番(GitHub Pages)では notion-bridge に差し替える。
   read()/write() の2関数だけ置き換えれば他は無改修。
   ============================================================ */
/* ============================================================
   Notion同期設定
   4つのデータソースIDはNotion MCP経由で作成済み（2026-08-11）。
   APP_KEYはこのファイル作成時に生成した値。Worker側にも
   同じ値を `wrangler secret put APP_KEY` で登録すること。
   ============================================================ */
const BRIDGE_BASE = "https://notion-bridge.rattuti.workers.dev";
const APP_KEY = "A3IwBln5mcfVYqOQe-c_TncP6MzLtC7Q5lU7nnAhZ00";
const DS = {
  items:    "115d044f-dfce-4f8f-b2a5-3bb47eba8539", // スキンアイテム
  routines: "cbce8e0d-b187-4423-9fff-0ea644beaae3", // スキンルーティン
  logs:     "65d25f8a-846b-4daf-a6ab-1f3d45868b06", // 肌ログ
  plans:    "5314cfe3-02e3-4749-9ab7-fa8ad299601c", // プロアクティブ計画
  concerns: "163ab377-94b6-4957-8731-ccf47e23a9eb", // 気になるログ
};

const KEY = 'skinlog:data';
const LocalStore = {
  async read(){
    try{
      if(window.storage){ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
      const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null;
    }catch(e){ return null; }
  },
  async write(d){
    try{
      if(window.storage){ await window.storage.set(KEY, JSON.stringify(d)); return true; }
      localStorage.setItem(KEY, JSON.stringify(d)); return true;
    }catch(e){ console.error('ローカル保存に失敗', e); return false; }
  }
};

/* ---- notion-bridge 呼び出し ---- */
async function bridgeFetch(path, body){
  const res = await fetch(BRIDGE_BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-App-Key": APP_KEY },
    body: JSON.stringify(body),
  });
  if(!res.ok) throw new Error(`bridge ${path} -> ${res.status}`);
  return res.json();
}

async function bridgeQuery(dataSourceId){
  const j = await bridgeFetch('/query', { dataSourceId });
  return j.results || [];
}
async function bridgeCreate(dataSourceId, properties){
  return bridgeFetch('/create', { dataSourceId, properties });
}
async function bridgeUpdate(dataSourceId, pageId, properties){
  return bridgeFetch('/update', { dataSourceId, pageId, properties });
}
async function bridgeArchive(dataSourceId, pageId){
  return bridgeFetch('/update', { dataSourceId, pageId, archived: true });
}

/* ---- Notion(フラット行) <-> アプリ内部形式の変換 ---- */
function itemFromNotion(row){
  return {
    id: row.id, name: row['名前'] || '', cat: row['カテゴリ'] || 'その他',
    ing: row['主要成分'] || [], status: row['ステータス'] || 'お試し中',
    start: row['date:投入日:start'] || null, end: row['date:離脱日:start'] || null,
    opened: row['date:開封日:start'] || null,
    drug: row['薬剤フラグ'] === '__YES__',
  };
}
function itemToNotion(it){
  return {
    '名前': it.name, 'カテゴリ': it.cat, '主要成分': it.ing, 'ステータス': it.status,
    'date:投入日:start': it.start, 'date:離脱日:start': it.end, 'date:開封日:start': it.opened,
    '薬剤フラグ': it.drug ? '__YES__' : '__NO__',
  };
}
function routineFromNotion(row){
  return { id: row.id, name: row['名前'] || '', time: row['時間帯'] || '朝', items: row['アイテム'] || [], active: row['有効'] === '__YES__' };
}
function routineToNotion(r){
  return { '名前': r.name, '時間帯': r.time, 'アイテム': r.items, '有効': r.active !== false ? '__YES__' : '__NO__' };
}
function logFromNotion(row){
  return {
    date: row['日付'] || '', score: typeof row['肌スコア']==='number' ? row['肌スコア'] : null,
    am: row['朝完了'] === '__YES__', pm: row['夜完了'] === '__YES__',
    used: row['使用アイテム'] || [], symptoms: row['症状'] || [],
    drug: row['薬剤使用'] === '__YES__', applyType: row['塗布種別'] || null,
    temp: typeof row['気温']==='number' ? row['気温'] : null,
    humid: typeof row['湿度']==='number' ? row['湿度'] : null,
    _pageId: row.id,
  };
}
function logToNotion(l){
  return {
    '日付': l.date, '肌スコア': l.score, '朝完了': l.am ? '__YES__':'__NO__', '夜完了': l.pm ? '__YES__':'__NO__',
    '使用アイテム': l.used, '症状': l.symptoms, '薬剤使用': l.drug ? '__YES__':'__NO__',
    '塗布種別': l.applyType, '気温': l.temp, '湿度': l.humid,
  };
}
function planFromNotion(row){
  return {
    id: row.id, name: row['名前'] || '', days: row['塗布曜日'] || [], order: row['医師の指示（原文）'] || '',
    start: row['date:開始日:start'] || null, status: row['ステータス'] || '実施中',
    clinic: row['処方元'] || '', next: row['date:次回受診日:start'] || null,
  };
}
function planToNotion(pl){
  return {
    '名前': pl.name, '塗布曜日': pl.days, '医師の指示（原文）': pl.order,
    'date:開始日:start': pl.start, 'ステータス': pl.status,
    '処方元': pl.clinic, 'date:次回受診日:start': pl.next,
  };
}
function concernFromNotion(row){
  return {
    id: row.id, datetime: row['日時'] || '', tags: row['症状タグ'] || [],
    comment: row['コメント'] || '', topics: (row['参考トピック'] || '').split(',').filter(Boolean),
    followup: row['対処メモ'] || '', status: row['状態'] || '気になる中',
  };
}
function concernToNotion(c){
  return {
    '日時': c.datetime, '症状タグ': c.tags, 'コメント': c.comment,
    '参考トピック': (c.topics || []).join(','), '対処メモ': c.followup, '状態': c.status,
  };
}

const NotionStore = {
  async read(){
    const [itemPgs, rtPgs, logPgs, planPgs, concernPgs] = await Promise.all([
      bridgeQuery(DS.items), bridgeQuery(DS.routines), bridgeQuery(DS.logs), bridgeQuery(DS.plans), bridgeQuery(DS.concerns),
    ]);
    const items = itemPgs.map(itemFromNotion);
    const routines = rtPgs.map(routineFromNotion);
    const plans = planPgs.map(planFromNotion);
    const concerns = concernPgs.map(concernFromNotion).sort((a,b) => a.datetime < b.datetime ? 1 : -1);
    const logs = {};
    logPgs.map(logFromNotion).forEach(l => { logs[l.date] = l; });
    if(!routines.length){
      routines.push({id:'r_am',name:'朝',time:'朝',items:[],active:true});
      routines.push({id:'r_pm',name:'夜',time:'夜',items:[],active:true});
    }
    return { items, routines, plans, logs, concerns };
  },

  async write(d){
    try{
      await Promise.all(d.items.map(it =>
        it.id && it.id.length > 20 ? bridgeUpdate(DS.items, it.id, itemToNotion(it)) : bridgeCreate(DS.items, itemToNotion(it))
      ));
      await Promise.all(d.routines.filter(r=>!r.id.startsWith('r_')).map(r =>
        bridgeUpdate(DS.routines, r.id, routineToNotion(r))
      ));
      await Promise.all(Object.values(d.logs).map(l =>
        l._pageId ? bridgeUpdate(DS.logs, l._pageId, logToNotion(l)) : bridgeCreate(DS.logs, logToNotion(l))
      ));
      await Promise.all(d.plans.map(pl =>
        pl.id && pl.id.length > 20 ? bridgeUpdate(DS.plans, pl.id, planToNotion(pl)) : bridgeCreate(DS.plans, planToNotion(pl))
      ));
      await Promise.all((d.concerns || []).map(c =>
        c.id && c.id.length > 20 ? bridgeUpdate(DS.concerns, c.id, concernToNotion(c)) : bridgeCreate(DS.concerns, concernToNotion(c))
      ));
      await LocalStore.write(d);
      return true;
    }catch(e){
      console.error('Notion同期に失敗。ローカルのみ保存します', e);
      await LocalStore.write(d);
      return false;
    }
  }
};

// キーワードマッチで示すための辞書。新しい診断文は生成せず、
// 既にアプリ内にある参考情報(あせも/アトピー/毛穴づまり)を指し示すだけに留める。
const CONCERN_TOPICS = [
  { topic: 'あせも', keywords: ['あせも', '汗疹', '汗', 'あせ'], tags: ['あせも'] },
  { topic: 'アトピー', keywords: ['アトピー', 'かゆみ', '湿疹', 'かさかさ'], tags: ['かゆみ', '乾燥'] },
  { topic: '毛穴づまり', keywords: ['毛穴', 'づまり', 'しこり', '耳たぶ', 'ぶつぶつ', 'できもの'], tags: ['毛穴づまり', 'ニキビ'] },
];
function matchConcernTopics(comment, tags){
  var text = (comment || '').toLowerCase();
  var hit = [];
  CONCERN_TOPICS.forEach(function(t){
    var kw = t.keywords.some(function(k){ return text.indexOf(k.toLowerCase()) !== -1; });
    var tg = t.tags.some(function(tag){ return tags.indexOf(tag) !== -1; });
    if((kw || tg) && hit.indexOf(t.topic) === -1) hit.push(t.topic);
  });
  return hit;
}
function buildConcernSearchLinks(comment, tags){
  const terms = [];
  const c = (comment || '').trim();
  if(c) terms.push(c.slice(0, 40));
  (tags || []).forEach(t => { if(!terms.includes(t)) terms.push(t); });
  if(!terms.length) return [];
  const q = '肌 ' + terms.join(' ');
  return [
    { label: 'Google検索', url: 'https://www.google.com/search?q=' + encodeURIComponent(q) },
    { label: 'Yahoo!知恵袋で調べる', url: 'https://search.yahoo.co.jp/search?p=' + encodeURIComponent(q + ' site:chiebukuro.yahoo.co.jp') },
  ];
}

function sortedLogs(){ return Object.values(D.logs).filter(l=>l.score!=null).sort((a,b)=>a.date<b.date?-1:1); }

function flareDays(){
  const ls = sortedLogs(); if(ls.length<10) return [];
  const out=[]; let runLow=[], runSym=[];
  ls.forEach((l,i)=>{
    const win = ls.slice(Math.max(0,i-28),i);
    const avg = win.length>=7 ? win.reduce((s,x)=>s+x.score,0)/win.length : null;
    if(avg!=null && l.score <= avg-1) runLow.push(l.date); else { if(runLow.length>=2) out.push(...runLow); runLow=[]; }
    const bad = l.symptoms.some(s=>s==='赤み'||s==='ヒリつき');
    if(bad) runSym.push(l.date); else { if(runSym.length>=3) out.push(...runSym); runSym=[]; }
  });
  if(runLow.length>=2) out.push(...runLow);
  if(runSym.length>=3) out.push(...runSym);
  return [...new Set(out)].sort();
}

function itemEffects(){
  const ls = sortedLogs().filter(l=>!l.drug);
  return D.items.filter(it=>!it.drug).map(it=>{
    const on = ls.filter(l=>l.used.includes(it.id));
    const off = ls.filter(l=>!l.used.includes(it.id));
    if(on.length<5||off.length<5) return null;
    const m = a => a.reduce((s,x)=>s+x.score,0)/a.length;
    return {item:it, on:on.length, off:off.length, diff:m(on)-m(off), mOn:m(on)};
  }).filter(Boolean).sort((a,b)=>b.diff-a.diff);
}

function trialCompare(it){
  if(!it.start) return null;
  const ls = sortedLogs().filter(l=>!l.drug);
  const before = ls.filter(l=>l.date<it.start && l.date>=addDays(it.start,-28));
  const after  = ls.filter(l=>l.date>=addDays(it.start,14));
  const m = a => a.length ? a.reduce((s,x)=>s+x.score,0)/a.length : null;
  return {before:m(before), after:m(after), nB:before.length, nA:after.length,
          days:Math.round((new Date(todayStr())-new Date(it.start))/864e5)};
}

function proStats(){
  const plans = D.plans.filter(p=>p.status==='実施中');
  if(!plans.length) return null;
  const cells=[]; let sched=0, done=0;
  for(let i=55;i>=0;i--){
    const d = addDays(todayStr(),-i);
    const wd = WD[new Date(d+'T00:00:00').getDay()];
    const isSched = plans.some(p=>p.days.includes(wd) && (!p.start||d>=p.start));
    const l = D.logs[d];
    const isDone = !!(l && l.applyType==='プロアクティブ');
    if(isSched){ sched++; if(isDone) done++; }
    cells.push({d, sched:isSched, done:isDone, future:d>todayStr()});
  }
  return {cells, sched, done, rate: sched? Math.round(done/sched*100):0};
}

function activeConflicts(){
  const using = D.items.filter(i=>i.status==='お試し中'||i.status==='定番');
  const out=[];
  CONFLICT_RULES.forEach(r=>{
    const A = using.filter(i=>i.ing.includes(r.a));
    const B = using.filter(i=>i.ing.includes(r.b));
    if(A.length&&B.length&&!(A.length===1&&B.length===1&&A[0].id===B[0].id))
      out.push({...r, names:[...new Set([...A,...B].map(i=>i.name))]});
  });
  return out;
}

function renderVerify(){
  const ls = sortedLogs();
  if(ls.length<10){
    $('#view').innerHTML = `<div class="empty">記録が10日分たまると、ここに効果の比較が出ます。<br>いまは <b class="num">${ls.length}</b> 日分です。
      <div style="margin-top:18px"><button class="btn" data-demo="1">デモデータで動きを見る</button></div></div>`;
    return;
  }
  const excluded = ls.filter(l=>l.drug).length;
  const eff = itemEffects();
  const pro = proStats();
  const flares = flareDays().slice(-8).reverse();
  const trials = D.items.filter(i=>i.status==='お試し中'&&!i.drug);

  const maxAbs = Math.max(0.35, ...eff.map(e=>Math.abs(e.diff)));
  const effHtml = eff.length ? eff.map(e=>{
    const w = Math.abs(e.diff)/maxAbs*50, pos = e.diff>=0;
    return `<div class="bar-row">
      <span class="bar-name">${esc(e.item.name)}</span>
      <span class="bar-track"><span class="bar-fill" style="left:${pos?50:50-w}%;width:${w}%;background:${pos?'var(--accent)':'var(--warn)'}"></span></span>
      <span class="bar-n">${e.diff>=0?'+':''}${e.diff.toFixed(2)}</span>
    </div>`;
  }).join('') : `<div class="muted">比較できるアイテムがまだありません。使用日・非使用日ともに5日以上たまると出ます。</div>`;

  const trialHtml = trials.map(it=>{
    const c = trialCompare(it);
    if(!c) return '';
    if(c.after==null) return `<div class="card"><div class="item-n">${esc(it.name)}</div>
      <div class="muted" style="margin-top:6px">投入から <b class="num">${c.days}</b> 日。効果の判定は投入14日目以降のデータで行うため、まだ比較していません。</div></div>`;
    const d = c.after - (c.before ?? c.after);
    const cls = Math.abs(d)<0.15?'flat':(d>0?'up':'down');
    return `<div class="card">
      <div class="item-n">${esc(it.name)}</div>
      <div class="metric" style="margin-top:8px">
        <span class="metric-v">${c.after.toFixed(2)}</span>
        <span class="metric-u">投入14日目以降の平均</span>
        <span class="delta ${cls}">${d>=0?'+':''}${d.toFixed(2)}</span>
      </div>
      <div class="muted" style="margin-top:6px">投入前28日 ${c.before?c.before.toFixed(2):'—'}（${c.nB}日） → 投入後 ${c.after.toFixed(2)}（${c.nA}日）</div>
    </div>`;
  }).join('');

  let proHtml = '';
  if(pro){
    const cols=[]; for(let i=0;i<8;i++) cols.push(pro.cells.slice(i*7,i*7+7));
    proHtml = `
      <div class="eyebrow">プロアクティブ塗布の実施</div>
      <div class="card">
        <div class="metric"><span class="metric-v">${pro.done}<span style="font-size:16px;color:var(--muted)">/${pro.sched}</span></span>
          <span class="metric-u">直近8週の予定日に対して</span></div>
        <div class="heat">${cols.map(c=>`<div class="heat-col">${
          c.map(x=>`<div class="hc ${x.future?'':(x.done?'done':(x.sched?'miss':''))}" title="${x.d}"></div>`).join('')
        }</div>`).join('')}</div>
        <div class="legend">
          <span><i style="background:var(--drug)"></i>実施</span>
          <span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>予定日・未記録</span>
          <span><i style="background:var(--surface-2)"></i>予定外</span>
        </div>
      </div>`;
  }

  const flareHtml = flares.length ? flares.map(d=>{
    const l = D.logs[d];
    const changed = D.items.filter(i=>i.start && Math.abs(new Date(d)-new Date(i.start))<14*864e5);
    return `<div class="flare-item">
      <span class="flare-d num">${d.slice(5).replace('-','/')}</span>
      <span style="flex:1;font-size:12.5px">スコア ${l.score}${l.symptoms.length?'／'+esc(l.symptoms.join('・')):''}
        ${changed.length?`<br><span class="muted">前後2週で変えたもの：${esc(changed.map(i=>i.name).join('、'))}</span>`:''}</span>
    </div>`;
  }).join('') : `<div class="muted">目立つ変化は見つかりませんでした。</div>`;

  $('#view').innerHTML = `
    ${excluded ? `<div class="notice" style="margin-top:22px">対象 ${ls.length} 日のうち <b class="num">${excluded}</b> 日を、薬剤を使った日として効果比較から除外しています。薬の影響でスキンケアの評価が上振れするのを避けるためです。</div>`:''}

    ${trials.length?`<div class="eyebrow">お試し中</div>${trialHtml}`:''}

    <div class="eyebrow">使った日と使わなかった日の差</div>
    <div class="card">${effHtml}</div>
    <div class="muted">スコアの平均差だけを並べています。季節・体調・他のアイテムの影響は分けられていないので、順位はあくまで見当をつけるためのものです。</div>

    ${proHtml}

    <div class="eyebrow">変化が続いた日</div>
    <div class="card">${flareHtml}</div>
    <div class="muted">気になる変化が続いているときは、この記録を持って受診の際に相談すると状況を伝えやすくなります。</div>

    <div class="eyebrow">受診サマリー</div>
    <div class="card">
      <div class="muted">実施率・スコア推移・変化が続いた日を1枚にまとめて印刷できます。</div>
      <button class="btn" style="margin-top:12px" onclick="window.print()">印刷する</button>

    <div style="height:20px"></div>

}

function renderRef(){
  const cf = activeConflicts();
  $('#view').innerHTML = `
    <div class="eyebrow">いま使っているものの組み合わせ</div>
    <div class="card">
      ${cf.length ? cf.map(c=>`<div class="conflict ${c.level==='info'?'info':''}">
        <div class="conflict-h">${esc(c.a)} と ${esc(c.b)}</div>

        <div class="muted" style="margin-top:3px">該当：${esc(c.names.join('、'))}</div>
      </div>`).join('') : `<div class="muted">気をつけたい組み合わせは見つかりませんでした。</div>`}
    </div>

    <div class="eyebrow">ステロイド外用薬の基礎</div>
    <div class="card ref">
      <dl>
        <dt>強さは5段階に分かれています</dt>
        <dd>強い順に、ストロンゲスト／ベリーストロング／ストロング／ミディアム（マイルド）／ウィークの5段階です。どれを使うかは部位・年齢・症状で変わるため、処方されたものを指示どおりに使ってください。</dd>
        <div class="rank">
          <div style="background:#5B2E27">I<br>ストロンゲスト</div>
          <div style="background:#7A4038">II<br>ベリーストロング</div>
          <div style="background:#9E5A4E">III<br>ストロング</div>
          <div style="background:#B98577">IV<br>ミディアム</div>
          <div style="background:#CBA79C">V<br>ウィーク</div>
        </div>

        <dt>塗る量の目安（1FTU）</dt>
        <dd>人差し指の先から第一関節までチューブから出した量が約1FTU（およそ0.5g）で、大人の手のひら2枚分の面積に塗る量にあたります。実際には量が少なすぎることのほうが多いと言われます。</dd>

        <dt>部位によって吸収されやすさが違います</dt>
        <dd>前腕の内側を1とすると、頬などの顔はおよそ13倍、頭皮は約3.5倍、手のひらは約0.8倍、足の裏は約0.1倍とされます。顔に体用の強いものを流用しない理由がここにあります。</dd>

        <dt>やめ方は自己判断で決めない</dt>
        <dd>急に中止すると症状が再燃することがあります。減らし方や、症状が落ち着いたあとに週2回程度続ける方法（プロアクティブ療法）の進め方は、処方元の指示に従ってください。</dd>

        <dt>長く不適切に使ったときに起こりうること</dt>
        <dd>皮膚が薄くなる、毛細血管が目立つ、口の周りの皮膚炎、にきびのような発疹、細菌や真菌の感染が悪化する、などが知られています。特に顔への長期の連用は注意が必要です。</dd>

        <dt>保湿剤は薬の代わりではありません</dt>
        <dd>保湿剤は外用薬と併用するものです。塗る順番に迷う場合は処方元に確認してください。</dd>
      </dl>
    </div>
    <div class="eyebrow">よくある症状</div>
    <div class="card ref">
      <dl>
        <dt>あせも（汗疹）</dt>
        <dd>
          <b>状況：</b>赤い小さな発疹やブツブツが、汗をかきやすい部位（首、背中、肘や膝の内側など）に集中して出る。かゆみを伴うことが多い。<br>
          <b>原因：</b>汗の出口（汗腺の管）が汚れや汗そのもので詰まり、汗が皮膚の中に漏れ出て炎症を起こす。高温多湿、通気性の悪い衣類、汗を放置する時間が長いことが誘因になる。<br>
          <b>対策：</b>汗をかいたらこまめに拭く・シャワーで流す。通気性のよい衣類にする。強くこすらない。悪化してかゆみが強い場合は、自己判断で放置せず受診を検討する。
        </dd>
        <dt>アトピー（アトピー性皮膚炎）</dt>
        <dd>
          <b>状況：</b>乾燥とかゆみを伴う湿疹が、よくなったり悪くなったりを繰り返す。肘・膝の内側、首、顔などに出やすい。<br>
          <b>原因：</b>皮膚のバリア機能が生まれつき弱く、外からの刺激やアレルゲンが入りやすい体質に、乾燥・汗・ストレス・季節の変化などの要因が重なって発症・悪化する。単一の原因ではなく体質と環境の組み合わせで起こる。<br>
          <b>対策：</b>保湿を毎日続けてバリア機能を補うことが土台になる。悪化時の外用薬（ステロイドなど）や、症状が落ち着いたあとの管理（プロアクティブ療法）は医師の指示に従う。自己判断での中断・強い薬への変更は避ける。
        </dd>
        <dt>毛穴づまり（耳たぶなど）</dt>
        <dd>
          <b>状況：</b>耳たぶや顔などに、皮膚の下にしこりのような膨らみができる。中央に小さな黒い点（開口部）が見えることがある。
          <b>原因：</b>皮脂や角質が毛穴の中に溜まって膨らむ場合と、皮膚の下に袋状の組織ができて中身が溜まる「粉瘤（ふんりゅう）」の場合がある。後者は市販薬や自己ケアでは解消しないタイプのできものであることが多い。
          <b>対策：</b>自分で押し出したり潰したりしない（炎症や感染を起こすことがある）。小さく痛みがなければ経過を見てもよいが、大きくなる・繰り返す・赤く腫れて痛む場合は皮膚科で診てもらう。粉瘤は必要に応じて処置（切除など）が選択肢になる。
        </dd>
      </dl>
    </div>

    <div class="notice">
      ここに表示しているのは一般的な参考情報です。使っている薬の量・期間・やめ方は、必ず処方元の医師や薬剤師の指示に従ってください。症状が悪化する場合や判断に迷う場合は受診してください。<br><br>
      このアプリは、薬や製品をすすめたり、使用量や減らし方を計算したり、症状の重さを判定したりはしません。
    </div>
    <div style="height:20px"></div>
  `;
}

/* ---- シート（追加・編集） ---- */
function sheet(html){
  const bg = document.createElement('div');
  bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}
function multi(name, opts, sel){
  return `<div class="chips">${opts.map(o=>`<button class="chip ${sel.includes(o)?'on':''}" data-multi="${name}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
}

function itemSheet(id){
  const it = D.items.find(i=>i.id===id) || {id:null,name:'',cat:'化粧水',ing:[],status:'お試し中',start:todayStr(),end:null,drug:false,opened:null};
  const bg = sheet(`
    <h3>${id?'アイテムを編集':'アイテムを追加'}</h3>
    <div class="field"><label for="f_name">商品名</label><input type="text" id="f_name" value="${esc(it.name)}" placeholder="例）〇〇 モイスチャーローション"></div>
    <div class="field"><label for="f_cat">カテゴリ</label><select id="f_cat">${CATS.map(c=>`<option ${c===it.cat?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>主要成分</label>${multi('ing', INGREDIENTS, it.ing)}</div>
    <div class="field"><label for="f_status">ステータス</label><select id="f_status">${['お試し中','定番','休止中','終了'].map(s=>`<option ${s===it.status?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label for="f_start">投入日（効果を見る起点になります）</label><input type="date" id="f_start" value="${it.start||''}"></div>
    <div class="field"><label for="f_opened">開封日</label><input type="date" id="f_opened" value="${it.opened||''}"></div>
    <div class="sheet-act">
      ${id?`<button class="btn" id="f_del">削除</button>`:''}
      <button class="btn btn-primary" id="f_ok">保存</button>
    </div>
  `);
  let ing = [...it.ing];
  bg.addEventListener('click', async e=>{
    const m = e.target.closest('[data-multi]');
    if(m){ const v=m.dataset.v; ing.includes(v)?ing.splice(ing.indexOf(v),1):ing.push(v); m.classList.toggle('on'); }
    if(e.target.id==='f_del'){ D.items = D.items.filter(i=>i.id!==id); await save(); bg.remove(); render(); }
    if(e.target.id==='f_ok'){
      const name = bg.querySelector('#f_name').value.trim();
      if(!name){ toast('商品名を入れてください'); return; }
      const cat = bg.querySelector('#f_cat').value;
      const status = bg.querySelector('#f_status').value;
      const prev = it.status;
      const rec = {...it, id: it.id||uid(), name, cat, ing, status,
        start: bg.querySelector('#f_start').value||null,
        opened: bg.querySelector('#f_opened').value||null,
        drug: cat==='外用薬（処方）'};
      if(status==='終了' && prev!=='終了' && !rec.end) rec.end = todayStr();
      if(status!=='終了') rec.end = null;
      if(it.id) D.items = D.items.map(i=>i.id===it.id?rec:i); else D.items.push(rec);
      await save(); bg.remove(); render();
    }
  });
}

function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1700);
}

/* ---- 操作 ---- */
document.addEventListener('click', async e=>{
  const tabBtn = e.target.closest('.tab');
  if(tabBtn){
    // 今日タブを離れる前に、未保存のコメント下書きと開閉状態を退避する
    // （他タブに切り替えて戻ると#viewごと書き換わり消えてしまうため）
    if(tab==='today'){
      const ta = document.getElementById('concernComment');
      if(ta) todayDraftComment = ta.value;
      const det = document.querySelector('#view details.extra');
      if(det) todayDetailsOpen = det.open;
    }
    tab = tabBtn.dataset.t; render(); return;
  }

  const rt = e.target.closest('[data-rt]');
  if(rt){
    const r = D.routines.find(x=>x.id===rt.dataset.rt), l = log(todayStr());
    const key = r.time==='朝'?'am':'pm';
    l[key] = !l[key];
    const others = D.routines.filter(x=>x!==r && (x.time==='朝'?l.am:l.pm)).flatMap(x=>x.items);
    l.used = [...new Set(l[key] ? [...l.used, ...r.items] : others)];
    await save(); render(); return;
  }

  const sc = e.target.closest('[data-score]');
  if(sc){
    const l = log(todayStr());
    l.score = Number(sc.dataset.score);
    render();
    if(l.temp==null){ const w = await fetchWeather(); l.temp=w.temp; l.humid=w.humid; }
    await save(); render(); return;
  }

  const pro = e.target.closest('[data-pro]');
  if(pro){
    const l = log(todayStr());
    const on = l.applyType==='プロアクティブ';
    l.applyType = on ? null : 'プロアクティブ';
    l.drug = !on;
    await save(); render(); return;
  }

  const sym = e.target.closest('[data-sym]');
  if(sym){
    const l = log(todayStr()), v = sym.dataset.sym;
    l.symptoms.includes(v) ? l.symptoms.splice(l.symptoms.indexOf(v),1) : l.symptoms.push(v);
    sym.classList.toggle('on');
    await save(); renderBand(); return;
  }

  if(e.target.closest('[data-adhoc]')){
    const l = log(todayStr());
    if(l.applyType==='リアクティブ'){ l.applyType=null; l.drug=false; }
    else { l.applyType='リアクティブ'; l.drug=true; }
    await save(); render(); return;
  }
  if(e.target.closest('[data-savecomment]')){
    const l = log(todayStr());
    const textarea = document.getElementById('concernComment');
    const comment = (textarea ? textarea.value : '').trim();
    if(!comment && !l.symptoms.length){ toast('コメントか症状のどちらかを入れてください'); return; }
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const datetime = `${todayStr()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const topics = matchConcernTopics(comment, l.symptoms);
    const entry = { id: uid(), datetime, tags: [...l.symptoms], comment, topics, followup: '', status: '気になる中' };
    D.concerns = [entry, ...(D.concerns||[])];
    // 下書き保持の仕組みが、保存済みの文面をそのまま次の下書きとして
    // 復元してしまわないよう、再描画前にクリアしておく
    if(textarea) textarea.value = '';
    todayDraftComment = '';
    await save(); render();
    toast('記録しました');
    return;
  }
  const fu = e.target.closest('[data-addfollowup]');
  if(fu){
    const id = fu.dataset.addfollowup;
    const entry = (D.concerns||[]).find(c => c.id === id);
    if(!entry) return;
    const bg = sheet(`
      <h3>対処メモを追記</h3>
      <div class="muted" style="margin-bottom:10px">${esc(entry.datetime)}の記録${entry.comment?'：'+esc(entry.comment):''}</div>
      <div class="field">
        <label for="followupText">試したこと・経過</label>
        <textarea id="followupText" placeholder="例：保湿を増やしたら数日で落ち着いた">${esc(entry.followup||'')}</textarea>
      </div>
      <div class="field">
        <label for="followupStatus">状態</label>
        <select id="followupStatus">
          ${['気になる中','経過観察','落ち着いた'].map(s=>`<option ${s===entry.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="sheet-act"><button class="btn btn-primary" id="followup_ok">保存</button></div>
    `);
    bg.addEventListener('click', async ev => {
      if(ev.target.id === 'followup_ok'){
        entry.followup = bg.querySelector('#followupText').value.trim();
        entry.status = bg.querySelector('#followupStatus').value;
        await save(); bg.remove(); render();
      }
    });
    return;
  }
  const delC = e.target.closest('[data-delconcern]');
  if(delC){
    const id = delC.dataset.delconcern;
    const entry = (D.concerns||[]).find(c => c.id === id);
    if(!entry) return;
    if(!confirm('この記録を削除しますか？')) return;
    D.concerns = (D.concerns||[]).filter(c => c.id !== id);
    render();
    try{
      if(entry.id && entry.id.length > 20) await bridgeArchive(DS.concerns, entry.id);
    }catch(err){
      console.error('Notion側の削除に失敗', err);
    }
    return;
  }

  if(e.target.closest('[data-add]')) return itemSheet(null);
  const ed = e.target.closest('[data-edit]'); if(ed) return itemSheet(ed.dataset.edit);
  if(e.target.closest('[data-addplan]')) return planSheet(null);
  const ep = e.target.closest('[data-editplan]'); if(ep) return planSheet(ep.dataset.editplan);
  const er = e.target.closest('[data-editrt]'); if(er) return routineSheet(er.dataset.editrt);
  if(e.target.closest('[data-demo]')) return seedDemo();
});

/* ---- デモデータ ---- */
async function seedDemo(){
  const mk = (name,cat,ing,status,start)=>({id:uid(),name,cat,ing,status,start,end:null,opened:start,drug:cat==='外用薬（処方）'});
  const T = todayStr();
  const a = mk('セラミド化粧水','化粧水',['セラミド'],'定番',addDays(T,-120));
  const b = mk('ナイアシンアミド美容液','美容液',['ナイアシンアミド'],'お試し中',addDays(T,-40));
  const c = mk('レチノールクリーム','美容液',['レチノール'],'お試し中',addDays(T,-18));
  const d = mk('日焼け止め SPF50','日焼け止め',[],'定番',addDays(T,-200));
  const m = mk('〇〇軟膏（処方）','外用薬（処方）',[],'定番',addDays(T,-60));
  D.items = [a,b,c,d,m];
  D.routines[0].items = [a.id,d.id];
  D.routines[1].items = [a.id,b.id,c.id];
  D.plans = [{id:uid(),name:'顔（〇〇軟膏）',days:['月','木'],order:'落ち着いたら週2回、月・木の夜に薄く。4週間後に再診。',start:addDays(T,-56),status:'実施中',clinic:'〇〇皮膚科',next:addDays(T,7)}];
  D.logs = {};
  for(let i=90;i>=0;i--){
    const day = addDays(T,-i);
    if(Math.random()<0.06) continue;
    const wd = WD[new Date(day+'T00:00:00').getDay()];
    const isPro = ['月','木'].includes(wd) && Math.random()<0.82;
    let s = 3 + (i<40?0.5:0) + (i<18?0.3:0) + (Math.random()-0.5)*1.6;
    if(i>60 && i<68) s -= 1.4;
    if(isPro) s += 0.5;
    const score = Math.max(1,Math.min(5,Math.round(s)));
    D.logs[day] = {date:day,score,am:Math.random()<0.9,pm:Math.random()<0.95,
      used:[a.id,d.id,...(i<40?[b.id]:[]),...(i<18?[c.id]:[])],
      symptoms: score<=2 ? (Math.random()<0.6?['赤み']:['乾燥']) : [],
      drug:isPro, applyType:isPro?'プロアクティブ':null,
      temp:null,humid:null};
  }
  await save(); toast('デモデータを入れました'); render();
}

/* ---- 起動 ---- */
(async()=>{
  try{
    D = (await NotionStore.read()) || blank();
  }catch(e){
    console.error('Notion読み込みに失敗。ローカルデータで起動します', e);
    D = (await LocalStore.read()) || blank();
    toast('Notionと繋がりませんでした。ローカルの記録を表示しています');
  }
  if(!D.plans) D.plans = [];
  if(!D.concerns) D.concerns = [];
  if(!D.routines || !D.routines.length){
    D.routines = [
      {id:'r_am',name:'朝',time:'朝',items:[],active:true},
      {id:'r_pm',name:'夜',time:'夜',items:[],active:true}
    ];
  }
  render();
})();
</script>
